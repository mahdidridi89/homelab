# Cilium utilise l'IPAM Kubernetes.
ipam:
  mode: kubernetes

# Cilium remplace kube-proxy pour la gestion des Services Kubernetes.
kubeProxyReplacement: true

# API Kubernetes locale exposée par KubePrism sur chaque nœud Talos.
k8sServiceHost: localhost
k8sServicePort: 7445
cluster:
  name: homelab

operator:
  # Un seul replica car le cluster n'a qu'un worker actuellement.
  replicas: 1

# Encapsulation VXLAN entre les nœuds.
routingMode: tunnel
tunnelProtocol: vxlan
gatewayAPI:
  enabled: true
# Talos monte déjà cgroup.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Capabilities compatibles avec Talos.
# SYS_MODULE est volontairement absent.
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
