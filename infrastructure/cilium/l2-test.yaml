apiVersion: apps/v1
kind: Deployment
metadata:
  name: l2-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: l2-test
  template:
    metadata:
      labels:
        app: l2-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: l2-test
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: l2-test
  ports:
    - name: http
      port: 80
      targetPort: http
