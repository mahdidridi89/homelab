grafana:
  persistence:
    enabled: true
    type: sts
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  defaultDashboardsTimezone: Europe/Paris

  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
