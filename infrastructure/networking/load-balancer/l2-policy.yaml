apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: homelab
spec:
  serviceSelector:
    matchExpressions:
      - key: somekey
        operator: NotIn
        values:
          - never-used-value

  nodeSelector:
    matchExpressions:
      - key: kubernetes.io/os
        operator: In
        values:
          - linux

  interfaces:
    - ^ens18$

  loadBalancerIPs: true
  externalIPs: false
