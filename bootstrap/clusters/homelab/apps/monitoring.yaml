apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 77.10.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/infrastructure/monitoring/values.yaml

    - repoURL: https://github.com/mahdidridi89/homelab.git
      targetRevision: main
      ref: values

    # Manifests Kubernetes propres au composant Monitoring.
    - repoURL: https://github.com/mahdidridi89/homelab.git
      targetRevision: main
      path: infrastructure/monitoring/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
