apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: load-balancer
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/mahdidridi89/homelab.git
    targetRevision: main
    path: infrastructure/networking/load-balancer

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
