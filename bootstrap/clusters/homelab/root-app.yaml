apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/mahdidridi89/homelab.git
    targetRevision: main
    path: bootstrap/clusters/homelab/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
